# GENERATED by tools/mirror-satellites.sh — edit there, not here.
name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset the rolling nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # This build's own version: <base>-nightly.<utc-date>.<run-number>, where the
          # base is the in-tree version advanced past any published stable release.
          # Ordered by semver precedence, so two rolling builds are comparable and a
          # prerelease always ranks below its finished stable.
          VERSION="$(node scripts/next-version.mjs nightly)"
          echo "Nightly version: $VERSION"
          gh release delete nightly --yes --cleanup-tag || true
          {
            printf '## Nightly `%s`\n\n' "$VERSION"
            printf 'Rolling **nightly** build of `ryu-warmup` from `main` — not a stable release.\n\n'
            printf 'Built from commit %s.\n\n' "${GITHUB_SHA}"
            printf 'Installed Ryu nodes never auto-update onto rolling builds; the updater only\n'
            printf 'tracks the latest tagged v* release. Use the tagged releases for anything real.\n'
          } > notes.md
          # TITLE FORMAT IS A CONTRACT, not decoration: `nightly` is a ROLLING tag that
          # carries no version, so the version is recovered by scanning this title for a
          # semver token (see `release_version` in apps/core/src/update/mod.rs). Keep it
          # a bare whitespace-delimited token; the commit stays in parens.
          gh release create nightly --prerelease --target "$GITHUB_SHA" \
            --title "Nightly $VERSION (${GITHUB_SHA:0:12})" --notes-file notes.md

  build:
    needs: prepare
    name: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Package the prebuilt companion bundle
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          test -d dist || { echo "no dist/ in this satellite" >&2; exit 1; }
          mkdir -p out
          tar -czf "out/ryu-warmup-ui-${TAG}.tar.gz" -C dist .
          cp dist/* out/ 2>/dev/null || true
          ( cd out
            for f in *; do
              case "$f" in *.sha256) continue ;; esac
              if command -v sha256sum >/dev/null 2>&1; then sha256sum "$f" > "$f.sha256"
              elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$f" > "$f.sha256"; fi
            done )
          ls -la out
      # gh release upload, NOT softprops: softprops PATCHes the release even
      # when it is only ADDING assets, and that PATCH is refused for the App
      # token ("Resource not accessible by integration") despite Contents:
      # write. The assets endpoint on its own is permitted.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: nightly
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no files matched" >&2; exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
